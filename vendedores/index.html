const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function normTel(t) {
  let d = String(t || '').replace(/\D/g, '').replace(/^00/, '');
  if (d.startsWith('54')) { if (!d.startsWith('549') && d.length === 12) d = '549' + d.slice(2); return d; }
  d = d.replace(/^0/, '');
  if (d.length === 12) { for (const a of [2, 3, 4]) { if (d.substr(a, 2) === '15') { d = d.slice(0, a) + d.slice(a + 2); break; } } }
  return d.length === 10 ? '549' + d : d;
}
function telBonito(d) { return d ? '+' + d.replace(/^(54)(9)(\d{2,4})(\d{4})(\d{4})$/, '$1 $2 $3 $4-$5') : ''; }
const ls = { get(k, def) { try { return JSON.parse(localStorage.getItem(k)) ?? def; } catch (e) { return def; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };

let fb = null, user = null;   // user = {email, nombre, codigo, admin}

  async getVendedor(email) {
    if (MODO_LOCAL) return ls.get('v_vendedores', {})[email] || null;
    const s = await fb.getDoc(fb.doc(fb.db, 'vendedores', email)); return s.exists() ? s.data() : null;
  },
  async listVendedores() {
    if (MODO_LOCAL) return Object.entries(ls.get('v_vendedores', {})).map(([email, v]) => ({ email, ...v }));
    const s = await fb.getDocs(fb.collection(fb.db, 'vendedores')); return s.docs.map(d => ({ email: d.id, ...d.data() }));
  },
  async saveVendedor(email, v) {
    if (MODO_LOCAL) { const all = ls.get('v_vendedores', {}); all[email] = v; ls.set('v_vendedores', all); return; }
    await fb.setDoc(fb.doc(fb.db, 'vendedores', email), v);
  },
  async logEnvio(e) {
    if (MODO_LOCAL) { const all = ls.get('v_envios', []); all.unshift({ ...e, ts: Date.now() }); ls.set('v_envios', all.slice(0, 200)); return; }
    await fb.addDoc(fb.collection(fb.db, 'envios'), { ...e, ts: fb.serverTimestamp() });
  },
  async listEnvios() {
    if (MODO_LOCAL) return ls.get('v_envios', []);
    const s = await fb.getDocs(fb.collection(fb.db, 'envios'));
    return s.docs.map(d => { const x = d.data(); return { ...x, ts: x.ts && x.ts.toMillis ? x.ts.toMillis() : 0 }; }).sort((a, b) => b.ts - a.ts).slice(0, 50);
  }
};
function codigoDe(nombre, email) {
  const base = (nombre || email).normalize('NFD').replace(/[^A-Za-z]/g, '').toUpperCase().slice(0, 3) || 'VEN';
  return base + String(Math.floor(100 + Math.random() * 900));

async function iniciarFirebase() {

  const a = app.initializeApp(FIREBASE_CONFIG);
  fb = { auth: auth.getAuth(a), db: fs.getFirestore(a), ...auth, ...fs };
}
function emailDe(u) { return ((u && (u.email || ((u.providerData || []).find(p => p.email) || {}).email)) || '').toLowerCase(); }
async function entrar(u) {
  const email = emailDe(u);
  if (!email) { $('loginMsg').style.display = 'block'; $('loginMsg').textContent = 'Google no devolvió el correo. Probá de nuevo desde Chrome.'; return; }
  let v = await datos.getVendedor(email);
  const admin = email === ADMIN_EMAIL;
  if (!admin && (!v || !v.activo)) {
    $('loginMsg').style.display = 'block';
    $('loginMsg').textContent = 'Tu cuenta (' + email + ') todavía no está habilitada. Pedile a Ruben que te agregue como vendedor.';
    if (fb) await fb.signOut(fb.auth);
    return;
  }
  if (admin && !v) { v = { nombre: 'Ruben', codigo: 'RUB001', activo: true }; try { await datos.saveVendedor(email, v); } catch (e) {} }
  user = { email, nombre: v.nombre, codigo: v.codigo, admin };
  $('chipSalir').style.display = 'inline-block';
  $('chipAdmin').style.display = admin ? 'inline-block' : 'none';
  irCatalogo();
}
window.salir = async () => {
  if (fb && fb.auth.currentUser) await fb.signOut(fb.auth);
  user = null; ls.set('v_local_user', null);
  $('chipSalir').style.display = 'none'; $('chipAdmin').style.display = 'none';
  vista('vLogin');
};
$('btnGoogle').onclick = async () => {
  $('loginMsg').style.display = 'none';
  if (MODO_LOCAL) { $('loginMsg').style.display = 'block'; $('loginMsg').textContent = 'Todavía no está conectada la nube. Usá el modo prueba para ver cómo funciona.'; return; }
  try {
    const p = new fb.GoogleAuthProvider(); p.addScope('email'); p.addScope('profile');
    if (fb.auth.currentUser && fb.auth.currentUser.isAnonymous) await fb.signOut(fb.auth);
    const r = await fb.signInWithPopup(fb.auth, p); await entrar(r.user);
  } catch (e) { $('loginMsg').style.display = 'block'; $('loginMsg').textContent = 'No se pudo ingresar con Google: ' + (e.code || e.message); }
};
$('btnLocal').onclick = async () => {
  user = { email: 'prueba@local', nombre: 'Vendedor de prueba', codigo: 'PRUEBA', admin: true };
  $('chipSalir').style.display = 'inline-block'; $('chipAdmin').style.display = 'inline-block'; irCatalogo();
};

/* ═════════ CATÁLOGO Y FICHA ═════════ */
let rubro = 'Todas', actual = null;
window.irCatalogo = () => { vista('vCatalogo'); pintarCatalogo(); };
window.pintarCatalogo = () => {
  $('cats').innerHTML = RUBROS.map(r => `<button class="${r === rubro ? 'on' : ''}" onclick="setRubro('${r}')">${r}</button>`).join('');
  const q = $('buscar').value.trim().toLowerCase();
  const lista = APPS.filter(a => (rubro === 'Todas' || a.r === rubro) && (!q || (a.n + ' ' + a.t + ' ' + a.r + ' ' + a.d).toLowerCase().includes(q)));
  $('grid').innerHTML = lista.length ? lista.map(a =>
    `<button class="tarj" onclick="abrirFicha('${a.id}')"><span class="em">${a.e}</span><b>${esc(a.n)}</b><span>${esc(a.t)}</span>${a.ok ? '' : '<i class="badge">Próximamente</i>'}</button>`).join('')
    : '<p style="color:var(--mut);padding:20px 0">No hay apps con esa búsqueda.</p>';
};
window.setRubro = r => { rubro = r; pintarCatalogo(); };
window.abrirFicha = id => {
  actual = APPS.find(a => a.id === id); if (!actual) return;
  const a = actual;
  const link = (u, txt) => u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${txt}</a>` : `<a class="off">${txt}</a>`;
  $('fichaBody').innerHTML = `
    <div class="ficha-h"><span class="em">${a.e}</span><div><h3>${esc(a.n)}</h3><p>${esc(a.t)}</p></div></div>
    ${a.ok ? '' : '<div class="aviso">Esta app todavía está en desarrollo: se puede mostrar, pero no enviar como prueba.</div>'}
    <div class="box"><p>${esc(a.d)}</p><ul>${a.b.map(x => '<li>' + esc(x) + '</li>').join('')}</ul></div>
    <div class="links">${link(a.demo, '▶ Ver demo')}${link(a.ayuda, '📖 Instructivo')}${link(a.ficha, '📄 Folleto')}</div>
    ${a.ok ? `
    <h2>Enviar la prueba por WhatsApp</h2>
    <div class="box">
      <label>Teléfono del cliente</label>
      <input id="tel" type="tel" inputmode="tel" placeholder="Ej: 11 2345 6789" oninput="actualizarMensaje()">
      <div class="prev" id="telPrev"></div>
      <label>Nombre del cliente (opcional)</label>
      <input id="cliNombre" placeholder="Ej: Marcela" oninput="actualizarMensaje()">
      <label>Mensaje (lo podés editar)</label>
      <textarea id="msg"></textarea>
      <div class="aviso" id="envMsg" style="display:none"></div>
      <button class="btn wa" id="btnEnviar" onclick="enviar()">Enviar por WhatsApp</button>
    </div>` : ''}`;
  vista('vFicha'); if (a.ok) actualizarMensaje(true);
};
function linkConCodigo() {
  const u = actual.url, sep = u.includes('?') ? '&' : '?';
  return u + sep + 'ref=' + encodeURIComponent(user ? user.codigo : '');
}
let msgEditado = false;
window.actualizarMensaje = (inicial) => {
  const t = normTel($('tel').value);
  $('telPrev').textContent = t ? 'Se enviará a ' + telBonito(t) : '';
  if (inicial) msgEditado = false;
  if (!msgEditado) {
    const nom = $('cliNombre').value.trim();
    $('msg').value = `Hola${nom ? ' ' + nom : ''}! Soy ${user.nombre} de RavenTechs. Te paso la prueba gratis de ${actual.n} (${actual.t.toLowerCase()}): ${linkConCodigo()}\n\nPodés probarla 14 días desde el celular, sin instalar nada. Si te interesa o tenés dudas, escribime por acá.`;
  }
};
document.addEventListener('input', e => { if (e.target && e.target.id === 'msg') msgEditado = true; });
window.enviar = async () => {
  const tel = normTel($('tel').value), m = $('msg').value.trim();
  const box = $('envMsg'); box.style.display = 'block'; box.className = 'aviso';
  if (tel.length < 11 || tel.length > 15) { box.textContent = 'Revisá el teléfono: tiene que incluir el código de área (por ejemplo 11 2345 6789).'; return; }
  if (!m) { box.textContent = 'El mensaje no puede estar vacío.'; return; }
  $('btnEnviar').disabled = true;
  try {
    await datos.logEnvio({ vendedorEmail: user.email, vendedor: user.nombre, codigo: user.codigo, appId: actual.id, app: actual.n, telefono: tel, cliente: $('cliNombre').value.trim() });
    box.className = 'ok'; box.textContent = 'Listo: se abrió WhatsApp con el mensaje. Tocá enviar allá.';
  } catch (e) { box.textContent = 'No se pudo registrar el envío (' + (e.code || e.message) + '), pero igual abrimos WhatsApp.'; }
  window.open('https://wa.me/' + tel + '?text=' + encodeURIComponent(m), '_blank');
  $('btnEnviar').disabled = false;
};

/* ═════════ ADMIN ═════════ */
window.irAdmin = async () => { vista('vAdmin'); await pintarAdmin(); };
async function pintarAdmin() {
  const vs = await datos.listVendedores(), es = await datos.listEnvios();
  const cuenta = {}; es.forEach(e => cuenta[e.vendedorEmail] = (cuenta[e.vendedorEmail] || 0) + 1);
  $('listaVend').innerHTML = vs.length ? vs.map(v => `<div class="vend"><div><b>${esc(v.nombre)}</b> · ${esc(v.codigo)}<small>${esc(v.email)} · ${cuenta[v.email] || 0} envíos</small></div>
    <button class="mini ${v.activo ? 'on' : ''}" onclick="toggleVend('${esc(v.email)}')">${v.activo ? '✅ Activo' : '⏸ Pausado'}</button></div>`).join('') : '<p style="color:var(--mut)">Todavía no hay vendedores cargados.</p>';
  $('listaEnvios').innerHTML = es.length ? `<table><tr><th>Cuándo</th><th>Vendedor</th><th>App</th><th>Teléfono</th></tr>${es.map(e => `<tr><td>${e.ts ? new Date(e.ts).toLocaleString('es-AR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : ''}</td><td>${esc(e.vendedor)}</td><td>${esc(e.app)}</td><td>${esc(telBonito(e.telefono))}${e.cliente ? '<br><small>' + esc(e.cliente) + '</small>' : ''}</td></tr>`).join('')}</table>` : '<p style="color:var(--mut)">Todavía no se envió ningún link.</p>';
}
window.agregarVendedor = async () => {
  const email = $('vEmail').value.trim().toLowerCase(), nombre = $('vNombre').value.trim();
  const m = $('adminMsg');
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email) || !nombre) { m.innerHTML = '<div class="aviso">Escribí un correo válido y el nombre.</div>'; return; }
  try {
    const ya = await datos.getVendedor(email);
    await datos.saveVendedor(email, { nombre, codigo: ya ? ya.codigo : codigoDe(nombre, email), activo: true });
    $('vEmail').value = ''; $('vNombre').value = ''; m.innerHTML = '<div class="ok">Vendedor agregado. Ya puede ingresar con esa cuenta de Google.</div>';
    await pintarAdmin();
  } catch (e) { m.innerHTML = '<div class="aviso">No se pudo guardar: ' + esc(e.code || e.message) + '</div>'; }
};
window.toggleVend = async email => {
  const v = await datos.getVendedor(email); if (!v) return;
  await datos.saveVendedor(email, { ...v, activo: !v.activo }); await pintarAdmin();
};

/* ═════════ ARRANQUE ═════════ */
(async function () {
  if (MODO_LOCAL) {
    $('btnLocal').style.display = 'block';
    const aviso = $('loginMsg'); aviso.style.display = 'block'; aviso.style.background = '#2b2410'; aviso.style.color = '#f2d17a';
    aviso.textContent = 'Modo prueba: la app todavía no está conectada a la nube, así que nada se guarda en el servidor.';
    vista('vLogin'); return;
  }
  try { await iniciarFirebase(); } catch (e) { vista('vLogin'); $('loginMsg').style.display = 'block'; $('loginMsg').textContent = 'No se pudo conectar: ' + e.message; return; }
  vista('vLogin');
  fb.onAuthStateChanged(fb.auth, async u => { if (u && !u.isAnonymous && !user) await entrar(u); });
})();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js',{scope:'/vendedores/'}).catch(function(){})})}</script>
</body>
</html>
