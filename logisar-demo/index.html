<!DOCTYPE html>
<!--
  LogisAR — Logística y distribución
  Versión: v0.3
  Fecha: 2026-10-24
  Changelog:
    v0.3 — Modo real con Firebase: login con Google, usuarios por rol (admin, operario, empresa, chofer),
           datos compartidos en tiempo real, contadores atómicos (E-0001, P-0001), fotos de entrega,
           ubicación en vivo del chofer y funcionamiento sin conexión.
           Modo demo local si no hay configuración o con ?demo=1.
           Nuevo: Equipo (alta de usuarios), alta de camiones, pedido directo, cancelar y reprogramar,
           presupuestos vencidos ya no se pueden aceptar, detalle de la carga, baja y ubicación de bultos,
           quitar bulto al preparar, datos de ejemplo que se pueden quitar. Reglas de Firestore en archivo aparte.
    v0.2-demo — PWA instalable, CSV de stock y pedidos, registro local de errores.
    v0.1-demo — Primera maqueta con los 4 roles, datos de ejemplo en el dispositivo.
  PENDIENTE:
    - Pegar la configuración de Firebase en FB_CFG y publicar las reglas (ver guía)
    - Probar con dos celulares reales: operario + empresa, y chofer en ruta
    - Km automáticos con servicio de mapas (hoy se cargan por destino)
    - Alertas de presupuesto de Firebase (requiere plan Blaze)
    - Fotos en Storage si el volumen crece (requiere plan Blaze)
    - Avisos push al cambiar el estado de un envío
    - Admin PIN: 5 toques sobre el logo (PIN estándar del portfolio)
-->

<style>
:root{--bg:#0c1722;--bg2:#10202f;--card:#142638;--line:#24405a;--ink:#e9eff6;--mute:#8da3b8;--acc:#f2b705;--acc-t:#f2b705;--acc-ink:#1b1500;--ok:#3fb27f;--bad:#e5604d;--info:#4aa3ff;--r:12px}
[data-theme=light]{--bg:#edf1f5;--bg2:#ffffff;--card:#ffffff;--line:#d2dce6;--ink:#10243a;--mute:#566b80;--acc:#f2b705;--acc-t:#7c5800;--acc-ink:#1b1500;--ok:#1d8a5c;--bad:#c4412f;--info:#1d6fc4}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;padding-bottom:env(safe-area-inset-bottom)}
h1,h2,h3,h4,.brand b,.num{font-family:'Space Grotesk',Inter,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.mute{color:var(--mute)}.sm{font-size:13px}.big{font-size:22px;font-weight:700}
/* arranque */
#boot{position:fixed;inset:0;background:var(--bg);z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .4s}
#boot.out{opacity:0;pointer-events:none}
#boot .road{width:240px;height:6px;border-radius:3px;background:repeating-linear-gradient(90deg,var(--line) 0 20px,transparent 20px 40px);animation:road .6s linear infinite}
#boot .tr{animation:bump .5s ease-in-out infinite alternate;color:var(--acc)}
#boot b{font:700 22px 'Space Grotesk',sans-serif;letter-spacing:.5px}
@keyframes road{to{background-position:-40px 0}}
@keyframes bump{to{transform:translateY(-3px)}}
/* cabecera */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;gap:10px;align-items:center;user-select:none;cursor:pointer}
.brand svg{color:var(--acc)}
.brand b{display:block;font-size:17px;line-height:1.1}
.brand small{display:block;color:var(--mute);font-size:12px;max-width:52vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-r{display:flex;gap:4px}
.ib{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--mute)}
.ib:hover{background:var(--bg2);color:var(--ink)}
.main{max-width:720px;margin:0 auto;padding:16px 16px 110px}
.main>h2{font-size:22px;margin-bottom:4px}
.main>.lead{color:var(--mute);margin-bottom:14px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;overflow-x:auto;background:var(--bg2);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:1 0 74px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:10px;color:var(--mute);font-size:11.5px;font-weight:500}
.nav button.on{color:var(--acc-t);background:color-mix(in srgb,var(--acc) 14%,transparent)}
/* tarjetas */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.card.tap{cursor:pointer;width:100%;text-align:left;display:block}
.card.tap:hover{border-color:var(--acc)}
.rowb{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grp{font-size:14px;color:var(--mute);margin:18px 0 8px;font-weight:600}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat .num{font-size:28px;font-weight:700;line-height:1.1}
.stat small{color:var(--mute)}
.stat.hot{border-color:var(--acc)}
.stat.hot .num{color:var(--acc-t)}
.empty{padding:28px 12px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:var(--r)}
.chip{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid currentColor;white-space:nowrap;background:color-mix(in srgb,currentColor 12%,transparent)}

.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn.full{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.actions .btn{flex:1 1 140px}
label{display:block;font-size:13px;color:var(--mute);margin-top:12px}
input,select,textarea{display:block;width:100%;margin-top:4px;padding:10px 12px;min-height:44px;border-radius:10px;background:var(--bg);border:1px solid var(--line);color:var(--ink)}
textarea{resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checks{display:flex;flex-wrap:wrap;gap:6px 16px}
label.chk{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:14px;margin-top:10px}
label.chk input{width:20px;height:20px;min-height:0;margin:0;accent-color:var(--acc)}
.sw{position:relative;width:46px;height:26px;border-radius:13px;background:var(--line);flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--ok)}.sw.on::after{transform:translateX(20px)}

.brow:hover{outline:1px solid var(--acc)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:600;color:var(--ink);font-size:13px}
/* timeline */
.tl{display:flex;margin:10px 0 4px}
.tl .st{flex:1;text-align:center;position:relative;font-size:10.5px;color:var(--mute)}
.tl .st i{display:block;width:14px;height:14px;border-radius:50%;background:var(--line);margin:0 auto 4px;position:relative;z-index:1}
.tl .st::before{content:"";position:absolute;top:6px;left:-50%;width:100%;height:2px;background:var(--line)}
.tl .st:first-child::before{display:none}
.tl .st.done i,.tl .st.done::before,.tl .st.now::before,.tl .st.bad::before{background:var(--ok)}
.tl .st.done i{background:var(--ok)}
.tl .st.now i{background:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 30%,transparent)}
.tl .st.now{color:var(--ink);font-weight:600}
.tl .st.bad i{background:var(--bad)}.tl .st.bad{color:var(--bad);font-weight:600}
/* modal */
.mback{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--bg2);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:up .22s ease-out}

.modal h3{font-size:19px;margin-bottom:2px}
.desg{margin-top:14px;padding:12px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:14px}
.desg .l{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.desg .l small{color:var(--mute);display:block}
.desg .t{border-top:1px dashed var(--line);margin-top:6px;padding-top:8px;font-weight:700;font-size:17px}
/* hoja imprimible */
.sheet{background:#fff;color:#10243a;border-radius:10px;padding:18px;border:1px solid #d2dce6;font-size:14px}
.sheet h3{color:#10243a}
.sheet .l{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #e6ecf2;gap:10px}
.sheet .l small{display:block;color:#566b80}
.sheet .t{display:flex;justify-content:space-between;padding-top:10px;font-weight:700;font-size:18px}
.sheet .hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:10px}
.sheet .mm{color:#566b80;font-size:12.5px;margin-top:10px}
.label{background:#fff;color:#000;border:2px solid #000;border-radius:6px;padding:12px;text-align:center}
.label .bars{width:100%;height:78px;display:block;margin:8px 0 4px}
.label .code{color:#000;font-size:16px;letter-spacing:2px}
.label b{font-size:16px;display:block}
.label .meta{font-size:12.5px;color:#222;margin-top:4px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:80;font-size:14px;font-weight:500;max-width:88vw;text-align:center}
.toast.bad{background:var(--bad);color:#fff}
/* ingreso de roles */
.login{max-width:460px;margin:0 auto;padding:calc(36px + env(safe-area-inset-top)) 18px 40px;text-align:center}
.login svg.lg{color:var(--acc);margin-bottom:6px}
.login h1{font-size:34px}
.login h2{font-size:19px;margin:22px 0 4px}
.login p{margin-bottom:14px}
.pick{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:left;padding:14px 16px;margin-bottom:10px;border-radius:var(--r);background:var(--card);border:1px solid var(--line)}
.pick:hover{border-color:var(--acc)}
.pick b{font-size:16px}.pick small{color:var(--mute)}
.scanrow{display:flex;gap:8px;align-items:flex-end}
.scanrow>div{flex:1}
video#cam{display:none;width:100%;border-radius:10px;margin-top:10px;background:#000}
.foto{width:100%;max-height:200px;object-fit:cover;border-radius:8px;margin-top:6px}
@media print{
  body *{visibility:hidden}
  .printarea,.printarea *{visibility:visible}
  .printarea{position:absolute;left:0;top:0;width:100%;border:0;padding:8px}
  .noprint{display:none!important}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.login .btn.full+.btn.full{margin-top:8px}
.brow .btn.sm{min-height:30px;padding:0 10px}
a{color:inherit}
</style>
</head>

<div id="boot"><svg class="tr" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6h12v10H2zM14 10h4l3 3v3h-7"/><circle cx="6" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg><div class="road"></div><b>LogisAR</b></div>

<script>
'use strict';
/* ===== configuración ===== */
const VERSION='v0.3',PIN='2580',ADMIN_MAIL='rgaraventa@gmail.com',SDK='10.12.2';
/* Pegá acá la configuración de tu proyecto Firebase (Configuración del proyecto > Tus apps > Web).
   Mientras diga PEGAR..., la app funciona en modo demo local, sin login. */
const FB_CFG={apiKey:'PEGAR_API_KEY',authDomain:'PEGAR_PROYECTO.firebaseapp.com',projectId:'PEGAR_PROYECTO',storageBucket:'PEGAR_PROYECTO.appspot.com',messagingSenderId:'PEGAR',appId:'PEGAR'};
const FORCE_DEMO=/[?&]demo=1/.test(location.search);
const LIVE=!FORCE_DEMO&&!/^PEGAR/.test(FB_CFG.apiKey);
const KEY='logisar_demo_v3';
const COLS=['empresas','productos','bultos','avisos','destinos','tarifas','camiones','presupuestos','pedidos','usuarios'];

/* ===== utilidades ===== */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(4,'0');
const DAY=864e5,HOUR=36e5;
const fmt$=new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0});
const money=n=>fmt$.format(Math.round(n||0));
const fdt=t=>new Date(t).toLocaleString('es-AR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const fd=t=>new Date(t).toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'});
const km2=(a,b,c,d)=>{const R=6371e3,r=x=>x*Math.PI/180,dl=r(c-a),dn=r(d-b),h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))};

/* ===== iconos ===== */
const IC={
grid:'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>',
doc:'<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/>',
box:'<path d="M3 7l9-4 9 4-9 4z"/><path d="M3 7v10l9 4 9-4V7M12 11v10"/>',
truck:'<path d="M2 6h12v10H2zM14 10h4l3 3v3h-7"/><circle cx="6" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',
building:'<path d="M4 21V5l8-2v18M12 9l8 2v10M2 21h20M8 9h1M8 13h1M8 17h1"/>',
tag:'<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.2"/>',
cash:'<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="3"/>',
plus:'<path d="M12 5v14M5 12h14"/>',
layers:'<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>',
scan:'<path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4M4 12h16"/>',
pin:'<path d="M12 21s7-6.5 7-12a7 7 0 10-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/>',
sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/>',
moon:'<path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/>',
swap:'<path d="M7 7h12l-3-3M17 17H5l3 3"/>',
team:'<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M17 11a3 3 0 100-6M21 20c0-2.5-1.5-4.6-4-5.5"/>',
logout:'<path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/>'};
const ic=(n,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]||''}</svg>`;

/* ===== Code 128 (tabla verificada con python-barcode y lectura con zxing) ===== */
const C128=["11011001100", "11001101100", "11001100110", "10010011000", "10010001100", "10001001100", "10011001000", "10011000100", "10001100100", "11001001000", "11001000100", "11000100100", "10110011100", "10011011100", "10011001110", "10111001100", "10011101100", "10011100110", "11001110010", "11001011100", "11001001110", "11011100100", "11001110100", "11101101110", "11101001100", "11100101100", "11100100110", "11101100100", "11100110100", "11100110010", "11011011000", "11011000110", "11000110110", "10100011000", "10001011000", "10001000110", "10110001000", "10001101000", "10001100010", "11010001000", "11000101000", "11000100010", "10110111000", "10110001110", "10001101110", "10111011000", "10111000110", "10001110110", "11101110110", "11010001110", "11000101110", "11011101000", "11011100010", "11011101110", "11101011000", "11101000110", "11100010110", "11101101000", "11101100010", "11100011010", "11101111010", "11001000010", "11110001010", "10100110000", "10100001100", "10010110000", "10010000110", "10000101100", "10000100110", "10110010000", "10110000100", "10011010000", "10011000010", "10000110100", "10000110010", "11000010010", "11001010000", "11110111010", "11000010100", "10001111010", "10100111100", "10010111100", "10010011110", "10111100100", "10011110100", "10011110010", "11110100100", "11110010100", "11110010010", "11011011110", "11011110110", "11110110110", "10101111000", "10100011110", "10001011110", "10111101000", "10111100010", "11110101000", "11110100010", "10111011110", "10111101110", "11101011110", "11110101110", "11010000100", "11010010000", "11010011100"];
function code128svg(text){
  const vals=[104];for(const ch of text)vals.push(ch.charCodeAt(0)-32);
  let sum=104;for(let i=1;i<vals.length;i++)sum+=vals[i]*i;
  vals.push(sum%103);
  const bits=vals.map(v=>C128[v]).join('')+'1100011101011';
  let r='';
  for(let i=0;i<bits.length;){let j=i;while(j<bits.length&&bits[j]===bits[i])j++;if(bits[i]==='1')r+=`<rect x="${i}" y="0" width="${j-i}" height="60"/>`;i=j}
  return `<svg class="bars" xmlns="http://www.w3.org/2000/svg" viewBox="-10 0 ${bits.length+20} 60" preserveAspectRatio="none" fill="#000" role="img" aria-label="Código de barras ${esc(text)}">${r}</svg>`;
}

/* ===== cálculo de presupuestos ===== */
function calcular(o,D){
  D=D||db;
  const d=D.destinos.find(x=>x.id===o.destinoId),km=d?d.km:0,L=[];
  let sub=0,min=0;
  const aplica=t=>{
    if(t.opcional&&!(o.extras||[]).includes(t.id))return false;
    if(t.aplica==='frio'&&!o.frio)return false;
    if(t.aplica==='normal'&&o.frio)return false;
    if(t.aplica==='fragil'&&!o.fragil)return false;
    return true;
  };
  const act=D.tarifas.filter(t=>t.activo&&aplica(t));
  act.forEach(t=>{
    let m=null,det='';
    if(t.modo==='km'){m=t.valor*km;det=km+' km × '+money(t.valor)}
    else if(t.modo==='kg'){m=t.valor*(o.kg||0);det=(o.kg||0)+' kg × '+money(t.valor)}
    else if(t.modo==='bulto'){m=t.valor*(o.bultos||0);det=(o.bultos||0)+' bultos × '+money(t.valor)}
    else if(t.modo==='fijo'){m=t.valor;det='monto fijo'}
    else if(t.modo==='min'){min=Math.max(min,t.valor)}
    if(m!==null){L.push({n:t.nombre,det,m:Math.round(m)});sub+=m}
  });
  act.filter(t=>t.modo==='pct').forEach(t=>{const m=Math.round(sub*t.valor/100);L.push({n:t.nombre,det:t.valor+'% sobre '+money(sub),m})});
  let total=L.reduce((a,l)=>a+l.m,0);
  if(min&&total<min){L.push({n:'Completa el mínimo por viaje',det:'mínimo '+money(min),m:min-total});total=min}
  return{lineas:L,total};
}

let FB=null,fs=null,auth=null,ME=null,UNSUB=[],SH={},errCount=0;
const sj=v=>JSON.stringify(v,(k,x)=>x&&typeof x==='object'&&!Array.isArray(x)?Object.keys(x).sort().reduce((o,k2)=>(o[k2]=x[k2],o),{}):x);
const clean=v=>v===undefined?null:JSON.parse(JSON.stringify(v));
const dataOf=x=>{const o=clean(x);delete o.id;return o};
const shadowOf=x=>{const o={};for(const k in x){if(k==='id')continue;o[k]=sj(x[k])}return o};
const ref=(col,id)=>fs.collection(col).doc(id);
function writeFail(e){
  logErr('write: '+(e.code||'')+' '+e.message);
  toast(e.code==='permission-denied'?'No tenés permiso para esa acción':'No se pudo guardar: '+(e.message||e.code),1);
}
/* Compara la memoria contra lo último que se sincronizó y manda un solo lote atómico con las diferencias */
function liveSave(){
  if(!fs||!ME)return;
  const ops=[];
  COLS.forEach(col=>{
    const SHc=SH[col]||(SH[col]={}),ids=new Set();
    db[col].forEach(x=>{
      ids.add(x.id);const s=SHc[x.id];
      if(!s){ops.push(b=>b.set(ref(col,x.id),dataOf(x)));SHc[x.id]=shadowOf(x);return}
      const ch={};let any=false;
      for(const k in x){if(k==='id')continue;if(s[k]!==sj(x[k])){ch[k]=clean(x[k]);any=true}}
      for(const k in s){if(!(k in x)){ch[k]=FB.firestore.FieldValue.delete();any=true}}
      if(any){ops.push(b=>b.update(ref(col,x.id),ch));SHc[x.id]=shadowOf(x)}
    });
    Object.keys(SHc).forEach(id=>{if(!ids.has(id)){ops.push(b=>b.delete(ref(col,id)));delete SHc[id]}});
  });
  if(!ops.length)return;
  for(let i=0;i<ops.length;i+=400){const b=fs.batch();ops.slice(i,i+400).forEach(f=>f(b));b.commit().catch(writeFail)}
}
function applyChange(col,type,id,data){
  const SHc=SH[col]||(SH[col]={}),arr=db[col],i=arr.findIndex(x=>x.id===id);
  if(type==='removed'){if(i>=0)arr.splice(i,1);delete SHc[id];return}
  const d=Object.assign({},data,{id});
  if(i>=0)arr[i]=d;else arr.push(d);
  SHc[id]=shadowOf(d);
}
function listen(col,q){
  UNSUB.push(q.onSnapshot(snap=>{
    snap.docChanges().forEach(ch=>applyChange(col,ch.type,ch.doc.id,ch.doc.data()));
    scheduleRender();
  },e=>{logErr('listen '+col+': '+(e.code||e.message))}));
}
function listenDoc(col,id){
  UNSUB.push(ref(col,id).onSnapshot(s=>{applyChange(col,s.exists?'modified':'removed',id,s.exists?s.data():null);scheduleRender()},e=>{logErr('listenDoc '+col+': '+(e.code||e.message))}));
}
function stopListeners(){UNSUB.forEach(u=>{try{u()}catch(e){}});UNSUB=[];SH={};db=blank()}
function startListeners(){
  const c=n=>fs.collection(n),r=ME.rol;
  listen('destinos',c('destinos'));
  if(r==='admin'||r==='oper'){
    ['empresas','productos','bultos','avisos','camiones','pedidos'].forEach(n=>listen(n,c(n)));
    if(r==='admin'){
      ['tarifas','presupuestos','usuarios'].forEach(n=>listen(n,c(n)));
      UNSUB.push(c('actividad').orderBy('t','desc').limit(25).onSnapshot(s=>{db.log=s.docs.map(x=>x.data());scheduleRender()},e=>logErr('actividad: '+(e.code||e.message))));
    }
  }else if(r==='empresa'){
    const E=ME.empresaId;
    listenDoc('empresas',E);
    ['productos','bultos','pedidos'].forEach(n=>listen(n,c(n).where('empresaId','==',E)));
    listen('presupuestos',c('presupuestos').where('empresaId','==',E).where('visibleEmpresa','==',true));
  }else if(r==='chofer'){
    listenDoc('camiones',ME.camionId);
    listen('pedidos',c('pedidos').where('camionId','==',ME.camionId));
    listen('empresas',c('empresas'));
  }
}

function scheduleRender(){if(rq)return;rq=setTimeout(()=>{rq=0;render(true)},40)}
function formSnap(){const o={};$$('#app input[id],#app select[id],#app textarea[id]').forEach(e=>{o[e.id]=e.type==='checkbox'?e.checked:e.value});return o}
function formRestore(o){for(const id in o){const e=document.getElementById(id);if(!e)continue;if(e.type==='checkbox')e.checked=o[id];else if(e.tagName==='SELECT'){if([...e.options].some(x=>x.value===o[id]))e.value=o[id]}else e.value=o[id]}}
function render(keep){
  const app=$('#app'),y=window.scrollY,f=document.activeElement,fid=keep&&f&&f.id&&app.contains(f)?f.id:null,fpos=fid&&f.selectionStart!=null?f.selectionStart:null,snap=keep?formSnap():null;
  if(LIVE&&S.state!=='app')app.innerHTML=vGate();
  else if(!S.role)app.innerHTML=vLogin();
  else{
    const tabs=tabsFor(S.role);
    if(!S.tab||!tabs.find(t=>t[0]===S.tab))S.tab=tabs[0][0];
    const V={panel:vPanel,pres:vPres,ped:vPed,rutas:vRutas,emp:vEmp,tar:vTar,cob:vCob,equipo:vEquipo,ing:vIng,stock:vStock,prep:vPrep,estock:vStock,epres:vPres,eenv:vEnv,ruta:vRuta};
    app.innerHTML=header()+'<main class="main">'+V[S.tab]()+'</main>'+(tabs.length>1?nav(tabs):'');
    if(S.tab==='ing')fillProds();
  }
  if(snap){formRestore(snap);if(S.tab==='ing')syncIngNew();window.scrollTo(0,y);if(fid){const e=document.getElementById(fid);if(e){e.focus();try{if(fpos!=null)e.setSelectionRange(fpos,fpos)}catch(x){}}}}
}
function header(){
  const c=S.role==='chofer'?cam(S.camId):null;
  const sub=S.role==='empresa'?esc(emp(S.empId).nombre):S.role==='chofer'?esc(c?c.chofer+' · '+c.patente:'sin camión asignado'):ROLE_NAME[S.role];
  const dark=document.documentElement.dataset.theme==='dark';
  const off=navigator.onLine===false?'<span class="chip c-bad" style="align-self:center;margin-right:4px">Sin conexión</span>':'';
  return `<header class="top"><div class="brand" data-act="logo">${logo()}<div><b>LogisAR</b><small>${sub}</small></div></div><div class="top-r">${off}<button class="ib" data-act="theme" aria-label="Cambiar tema claro u oscuro">${ic(dark?'sun':'moon')}</button><button class="ib" data-act="switch" aria-label="${LIVE?'Salir':'Cambiar de rol'}">${ic(LIVE?'logout':'swap')}</button></div></header>`;
}
function nav(tabs){return `<nav class="nav" aria-label="Secciones">${tabs.map(t=>`<button class="${S.tab===t[0]?'on':''}" data-act="tab" data-t="${t[0]}">${ic(t[2],20)}<span>${t[1]}</span></button>`).join('')}</nav>`}

/* ===== pantallas de ingreso ===== */
function vGate(){
  const brand=`<div class="lg" style="color:var(--acc)">${logo(54)}</div><h1>LogisAR</h1><p class="mute sm">Logística y distribución · ${VERSION}</p>`;
  if(S.state==='login')return `<div class="login">${brand}<h2>Ingresá a tu cuenta</h2><p class="mute">Entrá con el email que cargó el administrador.</p><button class="btn pri full" data-act="gsign">Entrar con Google</button>${S.authErr?`<p class="c-bad sm" style="margin-top:12px" role="alert">${esc(S.authErr)}</p>`:''}<p class="mute sm" style="margin-top:14px">Si el link se abrió dentro de WhatsApp u otra app, abrilo en Chrome o Safari.</p><p class="sm" style="margin-top:18px"><a href="?demo=1" style="color:var(--acc-t)">Ver la demo sin cuenta</a></p></div>`;
  if(S.state==='denied')return `<div class="login">${brand}<h2>Tu cuenta todavía no tiene acceso</h2><p class="mute">El email <b>${esc(S.mail)}</b> no está habilitado. Pedile al administrador que lo cargue en la sección Equipo.</p><button class="btn full" data-act="switch">Salir</button></div>`;
  if(S.state==='error')return `<div class="login">${brand}<h2>No pudimos abrir tu cuenta</h2><p class="mute">${esc(S.err||'Error desconocido')}. Revisá la conexión y probá de nuevo.</p><button class="btn pri full" data-act="reload">Reintentar</button><button class="btn full" style="margin-top:8px" data-act="switch">Salir</button></div>`;
  return `<div class="login">${brand}<p class="mute" role="status">Conectando…</p></div>`;
}
function vLogin(){
  let body;
  if(S.pick==='empresa')body=`<h2>¿Qué empresa?</h2><p class="mute">Cada empresa ve solamente su propia mercadería.</p>`+db.empresas.map(e=>`<button class="pick" data-act="role" data-r="empresa" data-id="${e.id}"><b>${esc(e.nombre)}</b><small>${esc(e.contacto)}</small></button>`).join('')+`<button class="btn full" data-act="back">Volver</button>`;
  else if(S.pick==='chofer')body=`<h2>¿Qué chofer?</h2><p class="mute">Cada chofer ve solamente sus entregas.</p>`+db.camiones.map(c=>`<button class="pick" data-act="role" data-r="chofer" data-id="${c.id}"><b>${esc(c.chofer)}</b><small>${esc(c.patente)} · ${esc(c.tipo)}</small></button>`).join('')+`<button class="btn full" data-act="back">Volver</button>`;
  else body=`<h2>Elegí un rol para recorrer la demo</h2><p class="mute">Mirá la app como la ve cada persona. Los datos son de ejemplo y quedan guardados en este dispositivo.</p>
  <button class="pick" data-act="role" data-r="admin"><b>Administrador</b><small>El operador logístico: ve y controla todo</small></button>
  <button class="pick" data-act="role" data-r="oper"><b>Operario de depósito</b><small>Recibe, etiqueta, ubica y prepara pedidos</small></button>
  <button class="pick" data-act="pick" data-r="empresa"><b>Empresa cliente</b><small>Ve su stock, pide presupuestos y sigue sus envíos</small></button>
  <button class="pick" data-act="pick" data-r="chofer"><b>Chofer</b><small>Ve sus entregas, confirma con foto y comparte ubicación</small></button>`;
  const inst=(!S.pick&&deferredPrompt)?'<button class="btn full" style="margin-top:12px" data-act="install">Instalar la app en este dispositivo</button>':'';
  return `<div class="login"><div class="lg" style="color:var(--acc)">${logo(54)}</div><h1>LogisAR</h1><p class="mute sm">Logística y distribución · demo ${VERSION}</p>${inst}${body}</div>`;
}

/* ===== ADMIN: panel ===== */
function vPanel(){
  const bult=db.bultos.filter(b=>b.estado==='stock').length;
  const act=db.pedidos.filter(p=>!FIN.includes(p.estado));
  const calle=new Set(db.pedidos.filter(p=>p.estado==='En camino').map(p=>p.camionId)).size;
  const porCobrar=db.pedidos.filter(p=>p.estado==='Entregado'&&p.cobro!=='Cobrado').reduce((a,p)=>a+p.precio,0);
  const nuevas=db.presupuestos.filter(p=>p.estado==='Solicitado').length;
  const pasos=[['Cargá tus camiones',db.camiones.length>0,'rutas'],['Cargá las empresas que te dejan mercadería',db.empresas.length>0,'emp'],['Completá los precios del tarifario',db.tarifas.some(t=>t.valor>0),'tar']].concat(LIVE?[['Dale acceso a tu equipo',db.usuarios.length>1,'equipo']]:[]);
  const falta=pasos.some(p=>!p[1]);
  return `<h2>Panel</h2><p class="lead">Resumen del día del depósito y la flota.</p>
  ${falta?`<div class="card"><b>Primeros pasos</b>${pasos.map(p=>`<button class="rowb" style="width:100%;text-align:left;padding:8px 0;border-top:1px dashed var(--line);margin-top:8px" data-act="tab" data-t="${p[2]}"><span>${p[1]?'✓':'○'} ${p[0]}</span><span class="chip ${p[1]?'c-ok':'c-mute'}">${p[1]?'Listo':'Pendiente'}</span></button>`).join('')}</div>`:''}
  <div class="stats">
    <div class="stat"><div class="num">${bult}</div><small>Bultos en depósito</small></div>
    <div class="stat"><div class="num">${act.length}</div><small>Pedidos activos</small></div>
    <div class="stat"><div class="num">${calle} / ${db.camiones.length}</div><small>Camiones en calle</small></div>
    <div class="stat hot"><div class="num">${money(porCobrar)}</div><small>Fletes por cobrar</small></div>
  </div>
  ${nuevas?`<button class="card tap" data-act="tab" data-t="pres"><div class="rowb"><b>${nuevas} solicitud${nuevas>1?'es':''} de presupuesto sin responder</b>${chip('Solicitado')}</div></button>`:''}
  <h4 class="grp">Pedidos en curso</h4>
  ${act.length?act.map(pedCard).join(''):'<div class="empty">No hay pedidos en curso.</div>'}
  <h4 class="grp">Actividad reciente</h4>
  <div class="card">${db.log.slice(0,6).map(l=>`<div class="rowb sm" style="padding:4px 0"><span>${esc(l.txt)}</span><span class="mute">${fdt(l.t)}</span></div>`).join('')||'<span class="mute">Sin movimientos.</span>'}</div>`;
}
function pedCard(p){
  const c=p.camionId?cam(p.camionId):null;
  return `<button class="card tap ped" data-act="ped" data-id="${p.id}"><div class="stub"><span class="num">${esc(p.num)}</span><small>${fd(p.fecha).slice(0,5)}</small></div><div class="body"><div class="rowb"><b>${esc(emp(p.empresaId).nombre)}</b>${chip(p.estado)}</div><span class="sm">${esc(dest(p.destinoId).nombre)}</span><span class="mute sm">${p.nBultos} bulto${p.nBultos>1?'s':''} · ${c?esc(c.patente):'sin camión'}${S.role==='admin'||S.role==='empresa'?' · '+money(p.precio):''}</span></div></button>`;

/* ===== PRESUPUESTOS ===== */
function vPres(){
  const isE=S.role==='empresa';
  let L=db.presupuestos.filter(p=>!isE||(p.empresaId===S.empId&&p.estado!=='Borrador'));
  const filtros=['Todos','Solicitado','Borrador','Enviado','Aceptado','Rechazado','Vencido'];
  if(S.pf!=='Todos')L=L.filter(p=>estPres(p)===S.pf);
  return `<div class="rowb"><h2>Presupuestos</h2><button class="btn pri sm" data-act="pnew">${ic('plus',18)} ${isE?'Pedir':'Nuevo'}</button></div>
  <p class="lead">${isE?'Pedí un precio antes de hacer el viaje. Cuando el operador lo envíe, lo aceptás desde acá.':'Armá el precio con el tarifario, ajustalo si hace falta y enviáselo a la empresa.'}</p>
  ${isE?'':`<div class="seg">${filtros.map(f=>`<button class="${S.pf===f?'on':''}" data-act="pf" data-f="${f}">${f}</button>`).join('')}</div>`}
  ${L.length?L.map(p=>{const e=estPres(p);const cot=(p.estado==='Solicitado'||p.estado==='Borrador');return `<button class="card tap" data-act="psheet" data-id="${p.id}"><div class="rowb"><b class="num">${esc(p.num)}</b>${chip(e)}</div><div>${isE?'':esc(emp(p.empresaId).nombre)+' → '}${esc(dest(p.destinoId).nombre)}</div><div class="rowb sm mute"><span>${p.bultos} bultos${p.frio?' · frío':''}${p.fragil?' · frágil':''}</span><b style="color:var(--ink)">${cot?'A cotizar':money(pTotal(p))}</b></div></button>`}).join(''):'<div class="empty">No hay presupuestos para mostrar.</div>'}`;
}
function fPres(id){
  const p=id?pres(id):null,isE=S.role==='empresa';

  ${isE?'':`<label>Empresa<select id="pf-emp" class="pf">${db.empresas.map(e=>`<option value="${e.id}" ${e.id===eId?'selected':''}>${esc(e.nombre)}</option>`).join('')}</select></label>`}
  <label>Destino<select id="pf-dest" class="pf">${db.destinos.map(d=>`<option value="${d.id}" ${d.id===v.destinoId?'selected':''}>${esc(d.nombre)}</option>`).join('')}</select></label>
  <label>Qué se transporta<textarea id="pf-det" rows="2" placeholder="Ej.: 6 cajas de hamburguesas congeladas">${esc(v.detalle||'')}</textarea></label>
  <div class="two"><label>Peso total (kg)<input id="pf-kg" class="pf" type="number" min="0" inputmode="decimal" value="${v.kg}"></label><label>Bultos<input id="pf-bul" class="pf" type="number" min="1" inputmode="numeric" value="${v.bultos}"></label></div>
  <div class="checks"><label class="chk"><input id="pf-frio" class="pf" type="checkbox" ${v.frio?'checked':''}> Carga fría</label><label class="chk"><input id="pf-fragil" class="pf" type="checkbox" ${v.fragil?'checked':''}> Carga frágil</label></div>
  ${isE?'':`<div class="checks">${db.tarifas.filter(t=>t.opcional&&t.activo).map(t=>`<label class="chk"><input class="pf pf-x" type="checkbox" value="${t.id}" ${(v.extras||[]).includes(t.id)?'checked':''}> ${esc(t.nombre)}</label>`).join('')}</div>
  <div id="desg" class="desg"></div>
  <label>Precio final (vacío = usar el calculado)<input id="pf-aj" class="pf" type="number" inputmode="numeric" value="${v.ajuste==null?'':v.ajuste}"></label>`}
  <label>Notas<textarea id="pf-notas" rows="2">${esc(v.notas)}</textarea></label>
  <div class="actions">${isE?`<button class="btn pri" data-act="pf-save" data-st="Solicitado">Pedir presupuesto</button>`:`${solic?'':`<button class="btn" data-act="pf-save" data-st="Borrador" data-id="${id||''}">Guardar borrador</button>`}<button class="btn pri" data-act="pf-save" data-st="Enviado" data-id="${id||''}">Guardar y enviar</button>`}</div>
  <div class="actions"><button class="btn" data-act="close">Cancelar</button></div>`);
  if(!isE)recomputeForm();
}
function readForm(){
  const g=s=>$(s);
  return{empresaId:g('#pf-emp')?g('#pf-emp').value:S.empId,destinoId:g('#pf-dest').value,kg:+g('#pf-kg').value||0,bultos:+g('#pf-bul').value||1,frio:g('#pf-frio').checked,fragil:g('#pf-fragil').checked,extras:$$('.pf-x:checked').map(x=>x.value),ajuste:(g('#pf-aj')&&g('#pf-aj').value!=='')?+g('#pf-aj').value:null,detalle:g('#pf-det').value.trim(),notas:g('#pf-notas').value.trim()};
}
function lineasHtml(L){return L.map(l=>`<div class="l"><span>${esc(l.n)}<small>${esc(l.det)}</small></span><b>${money(l.m)}</b></div>`).join('')}
function recomputeForm(){
  const d=$('#desg');if(!d)return;
  const o=readForm(),r=calcular(o);
  let h=lineasHtml(r.lineas);
  if(o.ajuste!=null)h+=`<div class="l"><span>Ajuste manual<small>diferencia con el calculado</small></span><b>${money(o.ajuste-r.total)}</b></div>`;
  d.innerHTML=(h||'<span class="mute">Elegí un destino y cargá la mercadería.</span>')+`<div class="l t"><span>Total</span><span>${money(o.ajuste!=null?o.ajuste:r.total)}</span></div>`;
}
function resumenTexto(p){
  return `Presupuesto ${p.num} — LogisAR\n${emp(p.empresaId).nombre} → ${dest(p.destinoId).nombre}\n${p.detalle?p.detalle+'\n':''}${p.bultos} bultos${p.kg?', '+p.kg+' kg':''}${p.frio?' · carga fría':''}${p.fragil?' · carga frágil':''}\nTotal: ${money(pTotal(p))}\nVálido ${p.valido} días desde ${fd(p.enviado||p.fecha)}.`;
}
function fSheet(id){
  const p=pres(id);if(!p)return;
  const isE=S.role==='empresa',e=estPres(p);
  const pend=p.estado==='Solicitado'||p.estado==='Borrador';
  const carga=`${p.bultos} bultos${p.kg?' · '+p.kg+' kg':''}${p.frio?' · fría':''}${p.fragil?' · frágil':''}`;
  let sheet;
  if(isE&&pend){
    sheet=`<div class="sheet printarea"><div class="hd"><div><h3>${esc(p.num)}</h3><small>Pedido el ${fd(p.fecha)}</small></div></div><div class="l"><span>Destino</span><b>${esc(dest(p.destinoId).nombre)}</b></div><div class="l"><span>Carga</span><b>${esc(carga)}</b></div>${p.detalle?`<div class="mm">${esc(p.detalle)}</div>`:''}${p.notas?`<div class="mm">${esc(p.notas)}</div>`:''}<div class="mm">El operador está armando el precio. Te avisamos cuando esté listo.</div></div>`;
  }else{
    const ajl=(p.ajuste!=null&&p.ajuste!=='')?`<div class="l"><span>Ajuste manual</span><b>${money(p.ajuste-p.total)}</b></div>`:'';
    sheet=`<div class="sheet printarea"><div class="hd"><div><h3>Presupuesto ${esc(p.num)}</h3><small>Emitido el ${fd(p.enviado||p.fecha)} · válido ${p.valido} días</small></div><b style="font-family:'Space Grotesk',sans-serif">LogisAR</b></div>
    <div class="l"><span>Empresa</span><b>${esc(emp(p.empresaId).nombre)}</b></div><div class="l"><span>Destino</span><b>${esc(dest(p.destinoId).nombre)}</b></div><div class="l"><span>Carga</span><b>${esc(carga)}</b></div>
    ${lineasHtml(p.lineas||[])}${ajl}<div class="t"><span>Total</span><span>${money(pTotal(p))}</span></div>${p.detalle?`<div class="mm">${esc(p.detalle)}</div>`:''}${p.notas?`<div class="mm">${esc(p.notas)}</div>`:''}<div class="mm">Valores en pesos argentinos. Facturación por fuera de la app.</div></div>`;
  }
  let acts='';
  if(!isE&&pend)acts=`<button class="btn pri" data-act="pedit" data-id="${id}">${p.estado==='Solicitado'?'Armar presupuesto':'Editar'}</button>`;
  if(!isE&&e==='Enviado')acts=`<button class="btn pri" data-act="pst" data-id="${id}" data-st="Aceptado">Registrar aceptado</button><button class="btn danger" data-act="pst" data-id="${id}" data-st="Rechazado">Rechazado</button>`;
  if(!isE&&e==='Vencido')acts=`<button class="btn pri" data-act="prenew" data-id="${id}">Renovar validez</button><button class="btn danger" data-act="pst" data-id="${id}" data-st="Rechazado">Rechazado</button>`;
  if(isE&&e==='Enviado')acts=`<button class="btn pri" data-act="pst" data-id="${id}" data-st="Aceptado">Aceptar presupuesto</button><button class="btn danger" data-act="pst" data-id="${id}" data-st="Rechazado">Rechazar</button>`;
  if(isE&&e==='Vencido')acts='<p class="mute sm" style="flex:1 1 100%">Este presupuesto venció. Pedí uno nuevo.</p>';
  if(p.pedidoId)acts+=`<button class="btn" data-act="ped" data-id="${p.pedidoId}">Ver pedido</button>`;
  const share=(!pend)?`<button class="btn" data-act="print">Imprimir / guardar PDF</button><button class="btn" data-act="wa" data-id="${id}">WhatsApp</button><button class="btn" data-act="copy" data-id="${id}">Copiar</button>`:'';
  modal(`<div class="rowb"><span class="mute sm">Estado</span>${chip(e)}</div><div style="margin-top:10px">${sheet}</div><div class="actions noprint">${acts}${share}</div><div class="actions noprint"><button class="btn" data-act="close">Cerrar</button></div>`);

function fPed(id){

function stockList(){
  const q=S.q.toLowerCase();let bs=db.bultos.filter(b=>b.estado!=='baja'&&bEst(b)!=='despachado');
  if(S.role==='empresa')bs=bs.filter(b=>b.empresaId===S.empId);

/* ===== escaneo ===== */
function scan(pedId,code){
  const o=ped(pedId);code=(code||'').trim().toUpperCase();if(!o||!code)return;
  const b=db.bultos.find(x=>x.code===code);
  if(!b)return toast('No encontramos ese código',1);
  if(b.empresaId!==o.empresaId)return toast('Ese bulto es de otra empresa',1);
  if(b.estado!=='stock')return toast(b.estado==='reservado'?'Ese bulto ya está reservado':'Ese bulto no está disponible',1);
  if(o.bultoIds.length>=o.nBultos)return toast('El pedido ya está completo',1);
  b.estado='reservado';b.pedidoId=o.id;o.bultoIds=o.bultoIds.concat([b.id]);
  if(o.estado==='Pendiente')setEst(o,'En preparación');
  save();fPrep(pedId);render();toast('Bulto '+b.code+' agregado');
}
async function startCam(pedId){
  if(!('BarcodeDetector' in window))return toast('Este navegador no lee códigos con la cámara',1);
  try{
    camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const v=$('#cam');v.srcObject=camStream;v.style.display='block';await v.play();
    const det=new BarcodeDetector({formats:['code_128','qr_code','ean_13']});
    const loop=async()=>{
      if(!camStream)return;
      try{const r=await det.detect(v);if(r.length){const c=r[0].rawValue;stopCam();scan(pedId,c);return}}catch(e){}
      setTimeout(loop,300);
    };
    loop();
  }catch(e){stopCam();toast('No se pudo abrir la cámara',1)}
}
function resize(f){
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=()=>{const im=new Image();im.onload=()=>{const w=Math.min(320,im.width),h=im.height*w/im.width,c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);res(c.toDataURL('image/jpeg',.6))};im.onerror=()=>res(null);im.src=r.result};
    r.onerror=()=>res(null);r.readAsDataURL(f);
  });
}

/* ===== ubicación en vivo del chofer ===== */
function pushLoc(lat,lng){
  const c=cam(S.camId);if(!c)return;
  const t=Date.now();
  if(t-lastGeo.t<60000&&km2(lat,lng,lastGeo.lat,lastGeo.lng)<50)return;
  lastGeo={t,lat,lng};
  c.lat=lat;c.lng=lng;c.locT=t;
  db.pedidos.filter(p=>p.camionId===c.id&&p.estado==='En camino').forEach(p=>{p.lat=lat;p.lng=lng;p.locT=t});
  save();render(true);
}
function geoStart(){
  if(!navigator.geolocation)return toast('Este dispositivo no permite compartir ubicación',1);
  GEO=navigator.geolocation.watchPosition(p=>pushLoc(p.coords.latitude,p.coords.longitude),()=>{toast('No se pudo obtener la ubicación',1);geoStop()},{enableHighAccuracy:true,maximumAge:15000,timeout:20000});
  toast('Compartiendo ubicación mientras la app esté abierta');render();
}
function geoStop(){if(GEO!=null&&navigator.geolocation)navigator.geolocation.clearWatch(GEO);GEO=null;render()}

    if(!n)return toast('Falta el nombre',1);if(isNaN(k))return toast('Faltan los kilómetros',1);
    let x=d.id?db.destinos.find(y=>y.id===d.id):null;
    if(!x){x={id:uid('d')};db.destinos.push(x)}
    Object.assign(x,{nombre:n,dir:$('#d-d').value.trim(),km:k});save();closeModal();render();toast('Destino guardado');
  },
  'd-del'(d){
    if(db.pedidos.some(p=>p.destinoId===d.id)||db.presupuestos.some(p=>p.destinoId===d.id))return toast('Se usa en pedidos o presupuestos',1);
    if(!confirm('¿Borrar el destino?'))return;db.destinos=db.destinos.filter(x=>x.id!==d.id);save();closeModal();render();
  },
  /* equipo */
  unew(){fUser(null)},uedit(d){fUser(d.id)},
  utog(d){
    const u=db.usuarios.find(x=>x.id===d.id);if(!u)return;
    if(ME&&u.id===ME.email)return toast('No podés quitarte tu propio acceso',1);
    u.activo=u.activo===false;save();render();
  },
  'u-save'(d){
    const mail=$('#u-m').value.trim().toLowerCase(),nom=$('#u-n').value.trim(),rol=$('#u-r').value;
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail))return toast('El email no es válido',1);
    if(!nom)return toast('Falta el nombre',1);
    let eid=null,kid=null;
    if(rol==='empresa'){eid=$('#u-e').value;if(!eid)return toast('Elegí la empresa',1)}
    if(rol==='chofer'){kid=$('#u-c').value;if(!kid)return toast('Elegí el camión',1)}
    let u=d.id?db.usuarios.find(x=>x.id===d.id):null;
    if(!u){if(db.usuarios.some(x=>x.id===mail))return toast('Ese email ya está cargado',1);u={id:mail,activo:true};db.usuarios.push(u)}
    if(ME&&u.id===ME.email&&rol!=='admin')return toast('No podés sacarte el rol de administrador',1);
    Object.assign(u,{email:mail,nombre:nom,rol});
    if(eid)u.empresaId=eid;else delete u.empresaId;
    if(kid)u.camionId=kid;else delete u.camionId;
    save();closeModal();render();toast('Persona guardada');
  },
  'u-del'(d){
    if(ME&&d.id===ME.email)return toast('No podés quitarte tu propio acceso',1);
    if(!confirm('¿Quitar el acceso de '+d.id+'?'))return;db.usuarios=db.usuarios.filter(x=>x.id!==d.id);save();closeModal();render();
  },
  /* cobros */
  cobro(d){const o=ped(d.id),c=['Pendiente','Facturado','Cobrado'];o.cobro=c[(c.indexOf(o.cobro)+1)%3];save();render()},
  csv(){
    const rows=[['Pedido','Empresa','Destino','Fecha','Flete','Estado de cobro']];
    db.pedidos.filter(p=>p.estado==='Entregado').forEach(p=>rows.push([p.num,emp(p.empresaId).nombre,dest(p.destinoId).nombre,fd(p.hist[p.hist.length-1].t),Math.round(p.precio),p.cobro]));
    download('liquidacion-fletes.csv',toCsv(rows),'text/csv;charset=utf-8');
  },
  csvStock(){
    const rows=[['Código','Empresa','Producto','Cantidad','Lote','Vencimiento','Ubicación','Estado']];
    db.bultos.filter(b=>b.estado!=='baja'&&bEst(b)!=='despachado'&&(S.role!=='empresa'||b.empresaId===S.empId)).forEach(b=>rows.push([b.code,emp(b.empresaId).nombre,prod(b.productoId).nombre,b.cant,b.lote,b.venc,b.ubic,b.estado]));
    download('stock-logisar.csv',toCsv(rows),'text/csv;charset=utf-8');
  },
  csvPed(){
    const rows=[['Pedido','Empresa','Destino','Bultos','Estado','Camión','Flete','Fecha']];
    db.pedidos.filter(p=>S.role!=='empresa'||p.empresaId===S.empId).forEach(p=>rows.push([p.num,emp(p.empresaId).nombre,dest(p.destinoId).nombre,p.nBultos,p.estado,p.camionId&&cam(p.camionId)?cam(p.camionId).patente:'',Math.round(p.precio),fd(p.fecha)]));
    download('pedidos-logisar.csv',toCsv(rows),'text/csv;charset=utf-8');
  },
  /* operario */
  async 'ing-ok'(){
    const eid=$('#ing-emp').value;if(!eid)return toast('Primero cargá una empresa',1);
    let pid=$('#ing-prod').value,nuevo=null;
    if(pid==='__new'||!pid){
      const n=$('#ing-pn').value.trim();if(!n)return toast('Escribí el nombre del producto',1);
      nuevo={id:uid('p'),empresaId:eid,nombre:n,frio:$('#ing-pf').checked,fragil:$('#ing-pg').checked};pid=nuevo.id;
    }
    const cant=parseInt($('#ing-cant').value,10);if(!(cant>0))return toast('La cantidad tiene que ser mayor a cero',1);
    const lote=$('#ing-lote').value.trim(),venc=$('#ing-venc').value,ubic=$('#ing-ubic').value.trim();
    const num=await nextNum('bulto');
    if(nuevo)db.productos.push(nuevo);
    const b={id:uid('b'),code:'LG'+emp(eid).cod+pad(num),empresaId:eid,productoId:pid,cant,ubic,estado:'stock',lote,venc,t:Date.now()};
    db.bultos.push(b);logAdd('Ingreso '+b.code+': '+prod(pid).nombre);save();render();fLabel(b.id);
  },
  label(d){fLabel(d.id)},
  'lb-save'(d){const b=db.bultos.find(x=>x.id===d.id);if(!b)return;b.ubic=$('#lb-ub').value.trim();logAdd(b.code+': ubicación '+(b.ubic||'sin ubicar'));save();closeModal();render();toast('Ubicación guardada')},
  'lb-baja'(d){const b=db.bultos.find(x=>x.id===d.id);if(!b||!confirm('¿Dar de baja el bulto '+b.code+'? Deja de contar en el stock.'))return;b.estado='baja';logAdd(b.code+': dado de baja');save();closeModal();render();toast('Bulto dado de baja')},
  'av-ok'(d){db.avisos=db.avisos.filter(a=>a.id!==d.id);save();render();toast('Aviso marcado como recibido')},
  prep(d){fPrep(d.id)},
  scan(d){scan(d.id,$('#scan-in').value)},
  sim(d){
    const o=ped(d.id),b=db.bultos.find(x=>x.empresaId===o.empresaId&&x.estado==='stock');
    if(!b)return toast('No quedan bultos de esta empresa en stock',1);
    scan(d.id,b.code);
  },
  unscan(d){
    const o=ped(d.id),b=db.bultos.find(x=>x.id===d.b);if(!o||!b)return;
    b.estado='stock';delete b.pedidoId;o.bultoIds=o.bultoIds.filter(x=>x!==b.id);
    if(o.estado==='Listo')setEst(o,'En preparación');
    save();fPrep(d.id);render();toast('Bulto quitado del pedido');
  },
  cam(d){startCam(d.id)},
  listo(d){const o=ped(d.id);setEst(o,'Listo');save();closeModal();render();toast('Pedido listo para salir')},
  /* empresa */
  aviso(){modal(`<h3>Avisar un envío</h3><p class="mute sm">Contale al depósito qué vas a mandar.</p><label>Qué mandás<input id="av-t" placeholder="Ej.: Yerba mate, 10 cajas"></label><div class="actions"><button class="btn pri" data-act="av-save">Enviar aviso</button><button class="btn" data-act="close">Cancelar</button></div>`)},
  'av-save'(){const t=$('#av-t').value.trim();if(!t)return toast('Escribí qué vas a mandar',1);db.avisos.unshift({id:uid('av'),empresaId:S.empId,texto:t,fecha:Date.now()});logAdd('Aviso de '+emp(S.empId).nombre+': '+t);save();closeModal();toast('Aviso enviado al depósito')},
  /* chofer */
  salir(d){const o=ped(d.id);setEst(o,'En camino');save();render();toast('Buen viaje')},
  ent(d){modal(`<h3>Confirmar entrega</h3><p class="mute sm">${esc(dest(ped(d.id).destinoId).nombre)}</p><label>Foto de la entrega (opcional)<input id="foto" type="file" accept="image/*" capture="environment"></label><div class="actions"><button class="btn pri" data-act="ent-ok" data-id="${d.id}">Confirmar entrega</button><button class="btn" data-act="close">Cancelar</button></div>`)},
  async 'ent-ok'(d){
    const o=ped(d.id),f=$('#foto').files[0];
    const data=f?await resize(f):null;
    if(data)savePhoto(o,data);
    setEst(o,'Entregado');save();closeModal();render();toast('Entrega confirmada');
  },
  noent(d){modal(`<h3>No pude entregar</h3><label>Motivo<select id="mot"><option>Local cerrado</option><option>Nadie recibió</option><option>Dirección incorrecta</option><option>Rechazó la mercadería</option><option>Otro</option></select></label><div class="actions"><button class="btn danger" data-act="noent-ok" data-id="${d.id}">Registrar</button><button class="btn" data-act="close">Cancelar</button></div>`)},
  'noent-ok'(d){const o=ped(d.id);o.motivo=$('#mot').value;setEst(o,'No entregado');save();closeModal();render();toast('Registrado')},
  geo(){if(GEO!=null)geoStop();else geoStart()}
};

/* ===== eventos ===== */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const f=ACT[el.dataset.act];if(!f)return;
  e.preventDefault();
  try{
    const r=f(el.dataset,el);
    if(r&&r.catch)r.catch(x=>{logErr('accion '+el.dataset.act+': '+(x.code||x.message));toast(needNet(x)?'Necesitás conexión para esta acción':'No se pudo completar: '+(x.code||x.message),1)});
  }catch(x){logErr('accion '+el.dataset.act+': '+x.message);toast('Error: '+x.message,1)}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.classList.contains('pf'))recomputeForm();
  if(t.id==='q'){S.q=t.value;const l=$('#stocklist');if(l)l.innerHTML=stockList()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.classList.contains('pf'))recomputeForm();
  if(t.id==='ing-emp')fillProds();
  if(t.id==='ing-prod')syncIngNew();
  if(t.id==='u-r')syncUserBoxes();
});

/* ===== arranque ===== */
try{const t=localStorage.getItem('logisar_theme');if(t)setTheme(t)}catch(e){}
if(LIVE){render();bootLive().catch(e=>{logErr('boot: '+e.message);S.state='error';S.err=e.message;render()})}
else{loadLocal();render()}
setTimeout(()=>{const b=$('#boot');if(b){b.classList.add('out');setTimeout(()=>b.remove(),500)}},1300);

</script>
</body>
</html>
